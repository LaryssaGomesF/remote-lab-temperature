<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Lato|Playfair Display|Bebas Neue|Montserrat:wght@200">

    <title>Controle de Temperatura</title>
    <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <link rel="stylesheet" href="/lab-remoto-temperatura/public/style.css">

    <script src="/lab-remoto-temperatura/public/script.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/rtsp-relay@1.3.0/browser.min.js"></script>

</head>

<body style="background:#F5F5F5">

    <div class="header">

        <div class="row-space-between">

            <img src="/lab-remoto-temperatura/public/imagens/logo-labcam.png" alt="Logo labcam" width="200"
                height="100">



            <h1 class="title-1">Bancada Controle de Temperatura - LABCAM</h1>

            <div class="row-auto ">
                <h1 class="title-2"> Dashboard</h1>
                <div class="divider"></div>
                <h1 class="title-3"> Tutorial</h1>
            </div>

        </div>


    </div>


    <div class="row-space-around">
        <div class="card">
            <h1 class="title-1"> Dados do controlador PID </h1>

            <div id="viewMode" class="row-space-between">

                <div class="divider"></div>

                <div class="column-center">
                    <span class="text-body-2">KP</span>
                    <span class="title-4" id="kpText"></span>

                </div>

                <div class="column-center">
                    <span class="text-body-2">KI</span>
                    <span class="title-4" id="kiText"></span>

                </div>

                <div class="column-center">
                    <span class="text-body-2">KD</span>
                    <span class="title-4" id="kdText"></span>
                </div>

                <div class="column-center">
                    <span class="text-body-2">Modo</span>
                    <label class="title-4" id="isCollecting" name="isCollecting"></label>
                </div>

                <div class="column-center">
                    <span class="text-body-2">Setpoint</span>
                    <span class="title-4" id="setpointText"></span>


                </div>

                <div class="column-center">
                    <button class="button-default-secondary" id="editButton">Editar</button>
                </div>

                <div class="divider"></div>

            </div>



            <div id="editMode" class="hidden">

                <div class="row-space-between">

                    <div class="divider"></div>

                    <div class="column-center">
                        <span class="text-body-2">KP</span>
                        <input type="number" id="kp" name="kp">

                    </div>

                    <div class="column-center">
                        <span class="text-body-2">KI</span>
                        <input type="number" id="ki" name="ki">
                    </div>

                    <div class="column-center">
                        <span class="text-body-2">KD</span>
                        <input type="number" id="kd" name="kd">
                    </div>


                    <div class="column-center">
                        <span class="text-body-2">Modo</span>
                        <span class="text-body-2">(Automático):</span>
                        <label class="container">
                            <input type="checkbox" id="mode" name="mode" checked="checked">
                            <span class="checkmark"></span>
                        </label>
                    </div>

                    <div class="column-center">
                        <span class="text-body-2">Setpoint</span>
                        <input type="number" id="setpoint" name="setpoint">
                    </div>

                    <div class="divider"></div>


                </div>

                <div class="divider-height"></div>


                <button class="button-default-primary" id="sendButton">Enviar</button>
                <button class="button-default-secondary " id="cancelButton">Cancelar</button>



            </div>



            <div id="chartContainer"></div>
            <div id="chartContainerError"></div>
            <div id="chartContainerActuador"></div>


            <button class="button-default-primary" id="saveDataButton">Exportar Dados</button>
            <button class="button-default-secondary" id="clearButton">Limpar Gráfico</button>



        </div>

        <div class="divider"></div>

        <div class="card">
            <h1 class="title-1"> Imagem câmera </h1>
            <video id="video" controls autoplay width="640" height="360"></video>

            <!-- Carrega a biblioteca corretamente da CDN -->
            <script src="https://cdn.jsdelivr.net/npm/rtsp-relay@2.2.0/dist/browser/umd/index.min.js"></script>

            <script>
                // Configurações da câmera
                const cameraConfig = {
                    ip: '192.168.1.32',
                    user: 'admin',
                    password: 'LabcamBancadaTemp',
                    channel: '1',
                    subtype: '0'
                };

                // URL RTSP formatada corretamente
                const rtspUrl = `rtsp://${cameraConfig.user}:${cameraConfig.password}@${cameraConfig.ip}:554/cam/realmonitor?channel=${cameraConfig.channel}&subtype=${cameraConfig.subtype}`;

                // Verifica se a biblioteca foi carregada
                if (typeof window.RTSPRelay === 'undefined') {
                    console.error('Biblioteca RTSPRelay não carregada!');
                    alert('Erro ao carregar o player de vídeo. Recarregue a página.');
                } else {
                    try {
                        const player = new window.RTSPRelay.Player({
                            video: document.getElementById('video'),
                            // Configurações otimizadas para Intelbras
                            transport: 'tcp',
                            withCredentials: false,
                            // Tentativa de conexão direta (funciona em alguns navegadores)
                            directPlay: true
                        });

                        player.load(rtspUrl).catch(err => {
                            console.error("Falha na conexão:", err);
                            alert(`Erro ao conectar à câmera:\n\n${err.message}\n\nVerifique:\n1. IP e credenciais\n2. Porta 554 aberta\n3. RTSP habilitado na câmera`);
                        });
                    } catch (e) {
                        console.error("Erro ao iniciar player:", e);
                    }
                }
            </script>
        </div>


    </div>

    <div class="baseboard-1"></div>
    <div class="baseboard-2"></div>



</body>

</html>
