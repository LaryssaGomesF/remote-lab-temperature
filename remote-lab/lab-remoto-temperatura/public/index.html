<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Lato|Playfair Display|Bebas Neue|Montserrat:wght@200">

    <title>Controle de Temperatura</title>
    <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <link rel="stylesheet" href="/lab-remoto-temperatura/public/style.css">

    <script src="/lab-remoto-temperatura/public/script.js" defer></script>



</head>

<body style="background:#F5F5F5">

    <div class="header">

        <div class="row-space-between">

            <img src="/lab-remoto-temperatura/public/imagens/logo-labcam.png" alt="Logo labcam" width="200"
                height="100">



            <h1 class="title-1">Bancada Controle de Temperatura - LABCAM</h1>

            <div class="row-auto ">
                <h1 class="title-2"> Dashboard</h1>
                <div class="divider"></div>
                <h1 class="title-3"> Tutorial</h1>
            </div>

        </div>


    </div>


    <div class="row-space-around">
        <div class="card">
            <h1 class="title-1"> Dados do controlador PID </h1>

            <div id="viewMode" class="row-space-between">

                <div class="divider"></div>

                <div class="column-center">
                    <span class="text-body-2">KP</span>
                    <span class="title-4" id="kpText"></span>

                </div>

                <div class="column-center">
                    <span class="text-body-2">KI</span>
                    <span class="title-4" id="kiText"></span>

                </div>

                <div class="column-center">
                    <span class="text-body-2">KD</span>
                    <span class="title-4" id="kdText"></span>
                </div>

                <div class="column-center">
                    <span class="text-body-2">Modo</span>
                    <label class="title-4" id="isCollecting" name="isCollecting"></label>
                </div>

                <div class="column-center">
                    <span class="text-body-2">Setpoint</span>
                    <span class="title-4" id="setpointText"></span>


                </div>

                <div class="column-center">
                    <button class="button-default-secondary" id="editButton">Editar</button>
                </div>

                <div class="divider"></div>

            </div>



            <div id="editMode" class="hidden">

                <div class="row-space-between">

                    <div class="divider"></div>

                    <div class="column-center">
                        <span class="text-body-2">KP</span>
                        <input type="number" id="kp" name="kp">

                    </div>

                    <div class="column-center">
                        <span class="text-body-2">KI</span>
                        <input type="number" id="ki" name="ki">
                    </div>

                    <div class="column-center">
                        <span class="text-body-2">KD</span>
                        <input type="number" id="kd" name="kd">
                    </div>


                    <div class="column-center">
                        <span class="text-body-2">Modo</span>
                        <span class="text-body-2">(Automático):</span>
                        <label class="container">
                            <input type="checkbox" id="mode" name="mode" checked="checked">
                            <span class="checkmark"></span>
                        </label>
                    </div>

                    <div class="column-center">
                        <span class="text-body-2">Setpoint</span>
                        <input type="number" id="setpoint" name="setpoint">
                    </div>

                    <div class="divider"></div>


                </div>

                <div class="divider-height"></div>

                <button class="button-default-primary" id="sendButton">Enviar</button>
                <button class="button-default-secondary " id="cancelButton">Cancelar</button>

            </div>

            <div id="chartContainer"></div>
            <div id="chartContainerError"></div>
            <div id="chartContainerActuador"></div>

            <button class="button-default-primary" id="saveDataButton">Exportar Dados</button>
            <button class="button-default-secondary" id="clearButton">Limpar Gráfico</button>


        </div>

        <div class="divider"></div>

        <div class="card">
            <h1 class="title-1"> Imagem câmera </h1>
            <video id="videoPlayer" controls autoplay muted width="640" height="360"></video>
            <div class="status" id="statusMessage">Carregando player...</div>
            <script>
                const video = document.getElementById("videoPlayer");
                const statusMessage = document.getElementById("statusMessage");

                // Caminho RELATIVO para a playlist M3U8 a partir da raiz do seu site.
                // Se stream_processor.php e player.html estão no mesmo diretório,
                // e $output_dir = __DIR__ . '/stream_output';
                // então o caminho seria 'stream_output/stream.m3u8'
           

               const hlsUrl = 'stream_output/stream.m3u8';

                // Verifica se o navegador suporta HLS nativamente (principalmente Safari)
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                    statusMessage.textContent = "Usando suporte HLS nativo do navegador.";
                    video.addEventListener('loadedmetadata', function () {
                        console.log("Metadados carregados (nativo).");
                        // Tenta iniciar a reprodução automaticamente
                        video.play().catch(e => console.warn("Autoplay bloqueado pelo navegador (nativo):", e));
                    });
                    video.addEventListener('error', function (e) {
                        statusMessage.textContent = `Erro ao carregar vídeo (nativo): ${e.message}`;
                        console.error('Erro no player nativo:', e);
                    });

                    // Se não suporta nativamente, usa hls.js
                } else if (Hls.isSupported()) {
                    statusMessage.textContent = "Suporte HLS nativo não encontrado. Usando hls.js.";
                    const hls = new Hls({
                        // Configurações opcionais do HLS.js
                        // debug: true, // Descomente para logs detalhados
                        startLevel: -1, // Começa com a melhor qualidade
                        capLevelToPlayerSize: true, // Ajusta a qualidade ao tamanho do player
                    });

                    hls.loadSource(hlsUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        console.log("Manifesto HLS carregado e parseado.");
                        statusMessage.textContent = "Stream carregado. Tentando reproduzir...";
                        // Tenta iniciar a reprodução automaticamente
                        video.play().catch(e => {
                            console.warn("Autoplay bloqueado pelo navegador (hls.js):", e);
                            statusMessage.textContent = "Stream carregado. Clique em play para iniciar (autoplay bloqueado).";
                        });
                    });

                    hls.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.error("Erro fatal de rede:", data);
                                    statusMessage.textContent = `Erro de rede ao carregar o stream: ${data.details}. Verifique o caminho do M3U8 e se o processo FFmpeg está rodando.`;
                                    // Tentar recuperar?
                                    // hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    console.error("Erro fatal de mídia:", data);
                                    statusMessage.textContent = `Erro de mídia: ${data.details}. O stream pode estar corrompido ou incompatível.`;
                                    // Tentar recuperar?
                                    // hls.recoverMediaError();
                                    break;
                                default:
                                    console.error("Erro fatal não recuperável:", data);
                                    statusMessage.textContent = `Erro HLS irrecuperável: ${data.details}.`;
                                    hls.destroy();
                                    break;
                            }
                        } else {
                            console.warn("Erro HLS não fatal:", data);
                            statusMessage.textContent = `Aviso HLS: ${data.details}`;
                        }
                    });

                } else {
                    statusMessage.textContent = "Seu navegador não suporta HLS nem com hls.js.";
                    console.error("HLS não é suportado neste navegador.");
                }

                // Adiciona um listener para quando o vídeo começa a tocar
                video.addEventListener('playing', () => {
                    statusMessage.textContent = "Reproduzindo stream.";
                    console.log("Vídeo começou a tocar.");
                });
            </script>
        </div>


    </div>

    <div class="baseboard-1"></div>
    <div class="baseboard-2"></div>



</body>

</html>
